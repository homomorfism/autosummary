[project]
name = "autosummary"
version = "0.1.0"
description = "Из записи лекции и слайдов — заземлённый веб-конспект и адаптивная проверка понимания."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "anthropic>=0.49",
    "pypdf>=4.0",
    "google-cloud-speech>=2.26",
    "google-cloud-storage>=2.16",
]

[project.scripts]
autosummary = "app.run:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
