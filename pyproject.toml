[project]
name = "autosummary"
version = "0.1.0"
description = "From a lecture recording and slides — a grounded web summary and adaptive comprehension check."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "anthropic>=0.49",
    "openai>=1.40",
    "pypdf>=4.0",
    "pymupdf>=1.24",
    "google-cloud-speech>=2.26",
    "google-cloud-storage>=2.16",
    "sentence-transformers>=5.6.0",
]

[project.scripts]
autosummary = "app.run:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "ipykernel>=6.29",
    "jiwer>=4.0.0",
    "sacrebleu>=2.6.0",
    "pandas>=3.0.3",
    "safety>=3.8.1",
    "sentence-transformers>=5.6.0",
    "pre-commit>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pkgs.safetycli.com/repository/public/pypi/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
